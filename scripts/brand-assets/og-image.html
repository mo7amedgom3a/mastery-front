--><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url(../../src/app/fonts/IBMPlexSansArabic-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:Plex;src:url(../../src/app/fonts/IBMPlexSansArabic-Medium.woff2) format("woff2");font-weight:500}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#17161b;color:#fffeeb;font-family:Plex}
.wrap{position:relative;display:flex;height:100%}
.copy{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 80px 0 40px;gap:28px}
.logo{height:40px;align-self:flex-start}
h1{margin:0;font-size:84px;line-height:1.15;font-weight:700}
p{margin:0;font-size:32px;line-height:1.6;font-weight:500;color:#d9d6cf;max-width:640px}
.tag{align-self:flex-start;border:2px solid #ff6555;color:#ff6555;padding:6px 16px;font-size:24px;font-weight:500}
.grid{width:420px;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 0 0 0;transform:translateY(-40px)}
.grid div{aspect-ratio:600/811;border-radius:12px;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid div:nth-child(2n){transform:translateY(90px)}
.bar{position:absolute;inset-inline:0;bottom:0;height:10px;background:#ff6555}
</style></head><body><div class="wrap">

<p>دورات ودبلومات بالعربية في التسويق والإدارة والقيادة وريادة الأعمال، مع خبراء يمارسون ما يدرّسونه.</p>
</div>
