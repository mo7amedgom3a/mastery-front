# This file is the build spec Amplify actually runs: when amplify.yml exists
# in the repository it takes precedence over the app-level spec in the
# Amplify console. The Terraform-managed copy
# (newwebsitebackend/infrastructure/modules/amplify) is the fallback, so keep
# the two identical.
#
# Platform is WEB_COMPUTE: the Next.js server runs (SSR + the /_next/image
# optimizer), enabled by NEXT_ENABLE_IMAGE_OPTIMIZATION=true.
#
# NODE_OPTIONS raises V8's default ~2 GB heap. The build instance is
# STANDARD_8GB, so 5632 MB (AWS's documented value) leaves room for the
# native/webpack processes; without it `next build` dies with
# "Ineffective mark-compacts near heap limit" (exit code 134).

version: 1

frontend:
  phases:
    preBuild:
      commands:
        # Install dependencies using the local npm cache.
        - npm ci --cache .npm --prefer-offline

        # Amplify's SSR runtime starts without app env vars; snapshot the
        # server-side ones into the bundle (applied in src/instrumentation.ts).
        - node scripts/generate-runtime-env.mjs

        # Raise the V8 heap before the build starts (8 GiB build instance).
        - export NODE_OPTIONS="--max-old-space-size=5632"

    build:
      commands:
        # Display available system memory.
        - free -h

        # Verify the heap limit picked up from NODE_OPTIONS.
        - node -e "const v8 = require('v8'); console.log('Heap limit (MB):', Math.round(v8.getHeapStatistics().heap_size_limit / 1024 / 1024))"

        # Build Next.js for Amplify WEB_COMPUTE (SSR). The image optimizer is part of the SSR
        # runtime, so it must be on at build time; without it remote covers are served raw
        # (500–800 KB PNGs) and LCP collapses on mobile.
        - export NEXT_ENABLE_IMAGE_OPTIMIZATION=true
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
