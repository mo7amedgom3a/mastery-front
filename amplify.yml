version: 1

frontend:
  phases:
    preBuild:
      commands:
        # Enforce Node.js version
        - nvm install 22.23.3
        - nvm use 22.23.3

        # Enforce npm version
        - npm install -g npm@10.9.9

        # Print environment information
        - node --version
        - npm --version
        - pwd

        # Ensure clean dependency installation
        - rm -rf node_modules
        - npm cache clean --force

        # Install dependencies
        - npm install --no-audit --no-fund

        # Verify installation
        - npm ls --depth=0

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - .next/cache/**/*