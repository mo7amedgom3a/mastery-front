# Kept identical to the app-level build spec managed by Terraform
# (newwebsitebackend/infrastructure/modules/amplify). Amplify uses the
# app-level spec, which overrides this file; this copy documents it in-repo.
# Platform is WEB_COMPUTE: the Next.js server runs (SSR + the /_next/image
# optimizer), enabled by NEXT_ENABLE_IMAGE_OPTIMIZATION=true.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Amplify's SSR runtime starts without app env vars; snapshot the
        # server-side ones into the bundle (applied in src/instrumentation.ts).
        - node scripts/generate-runtime-env.mjs
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
