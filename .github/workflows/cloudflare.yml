# Build and deploy the Cloudflare Workers site (OpenNext; see wrangler.jsonc).
#
#   pull request                    -> typecheck, lint and the OpenNext build.
#   push to main / workflow_dispatch -> the same, then deploy to the `mastery-front-prod` Worker
#                                      (landing.emasteryacademy.com) and prune old page-cache builds.
#
# Runtime vars come from wrangler.jsonc and Worker secrets (`wrangler secret`), which a deploy keeps.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers + R2 edit on the company account),
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (S3 API keys for the page-cache bucket).
# Repository variables: CLOUDFLARE_ACCOUNT_ID; optional NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN,
#   NEXT_PUBLIC_TOLT_PUBLIC_KEY.
name: Cloudflare build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer PR build replaces the running one; deploys of main queue instead of being cut off.
  group: cloudflare-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'Build' || 'Build and deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build-time values (NEXT_PUBLIC_* are inlined into the client bundle). Public, not secrets;
      # the publishable keys come from repository variables.
      NEXT_PUBLIC_DEPLOY_TARGET: cloudflare
      NEXT_PUBLIC_SITE_URL: https://landing.emasteryacademy.com
      NEXT_PUBLIC_ENV: production
      NEXT_ENABLE_IMAGE_OPTIMIZATION: "true"
      API_BASE_URL: https://api.v3.emasteryacademy.com/api/v1
      BUNNY_CDN_HOSTNAME: vz-be0e9539-e4b.b-cdn.net
      NEXT_PUBLIC_FARO_URL: https://faro-collector-prod-us-east-0.grafana.net/collect/661a8c1432921527fd32412dd34110f7
      NEXT_PUBLIC_FARO_APP_NAME: mastery-app
      NEXT_PUBLIC_FARO_APP_NAMESPACE: production
      NEXT_PUBLIC_FARO_APP_VERSION: "0.1.0"
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_TOLT_PORTAL_URL: https://affiliates.masteryacademy.site
      NEXT_PUBLIC_TOLT_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_TOLT_PUBLIC_KEY }}
      # Practice labs read the published labs from the API (/api/b2c/labs proxy), not the bundled mocks.
      NEXT_PUBLIC_LABS_API_MODE: live
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # PageProps / LayoutProps and the typed routes are generated into .next/types, which a fresh
      # checkout doesn't have; `next build` makes them too, but the typecheck runs first.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck and lint
        run: npm run check

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: OpenNext build
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      # OpenNext writes each build's pages under incremental-cache/<BUILD_ID>/ and never removes them.
      - name: Prune old page-cache builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/cf-cache-prune.mjs
