# Build check for the Cloudflare Workers deployment (OpenNext; see wrangler.jsonc).
#
#   push to main / pull request / workflow_dispatch -> typecheck, lint and the OpenNext build.
#
# Deploys are NOT done here: Cloudflare Workers Builds (connected to this repo in the Cloudflare
# dashboard) builds and deploys every push to main. See README.md "Deploy (Cloudflare)".
#
# Repository variables (optional): NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN, NEXT_PUBLIC_TOLT_PUBLIC_KEY.
name: Cloudflare build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer build of the same branch replaces the running one.
  group: cloudflare-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build-time values (NEXT_PUBLIC_* are inlined into the client bundle). Public, not secrets;
      # the publishable keys come from repository variables.
      NEXT_PUBLIC_DEPLOY_TARGET: cloudflare
      NEXT_PUBLIC_SITE_URL: https://landing.emasteryacademy.com
      NEXT_PUBLIC_ENV: production
      NEXT_ENABLE_IMAGE_OPTIMIZATION: "true"
      API_BASE_URL: https://api.v3.emasteryacademy.com/api/v1
      NEXT_PUBLIC_ADMIN_ORIGIN: https://mastery-admin-b2c.pages.dev
      BUNNY_CDN_HOSTNAME: vz-be0e9539-e4b.b-cdn.net
      NEXT_PUBLIC_FARO_URL: https://faro-collector-prod-us-west-0.grafana.net/collect/6951a101d516b3d305007cc3bdd2c580
      NEXT_PUBLIC_FARO_APP_NAME: mastery-app
      NEXT_PUBLIC_FARO_APP_NAMESPACE: production
      NEXT_PUBLIC_FARO_APP_VERSION: "0.1.0"
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_TOLT_PORTAL_URL: https://affiliates.masteryacademy.site
      NEXT_PUBLIC_TOLT_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_TOLT_PUBLIC_KEY }}
      # Practice labs read the published labs from the API (/api/b2c/labs proxy), not the bundled mocks.
      NEXT_PUBLIC_LABS_API_MODE: live
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # PageProps / LayoutProps and the typed routes are generated into .next/types, which a fresh
      # checkout doesn't have; `next build` makes them too, but the typecheck runs first.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck and lint
        run: npm run check

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: OpenNext build
        run: npm run cf:build
